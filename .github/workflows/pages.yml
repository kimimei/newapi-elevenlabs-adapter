name: Pages

# 把仓库变成可访问的静态站点，用来「在线听」examples/demo 里的样本。
#
# 前置条件（一次性，必须在网页上手动做）：
#   Settings → Pages → Build and deployment → Source 选 "GitHub Actions"。
#   不能指望 `enablement: true` 代劳 —— GITHUB_TOKEN 拿不到创建 Pages 站点所需的
#   admin 权限，未开启时这里会直接报 "Resource not accessible by integration"。
#   这一步没法从流水线取得，写在这儿免得下次又去试。
#
# 站点根保持仓库结构，所以试听页地址是：
#   https://<owner>.github.io/<repo>/examples/demo/
# 这样 README 里的相对链接和线上路径是同一套，不用维护两份。

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "examples/demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 站点已在上面的前置条件里手动开启。这里保留 enablement 作为兜底：
          # 已启用时它是幂等的，不会重复创建。
          enablement: true

      - name: Assemble site
        run: |
          set -euo pipefail
          mkdir -p _site
          # 只排除版本库与本地缓存，其余按仓库原样发布 —— 这是公开仓库，
          # 敏感项已由 scripts/release_check.py 在 CI 里挡过一道
          rsync -a --exclude '.git' --exclude '__pycache__' --exclude '.venv*' \
                --exclude 'logs' ./ _site/
          test -f _site/examples/demo/index.html
          ls -lh _site/examples/demo/ | head

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest -q

      # 发布门禁：扫真实 IP / 疑似令牌 / 测试音频 / 许可证持有人。
      # 这是一条会真的拦住你的规则，不是装饰。
      - name: Release gate
        run: python scripts/release_check.py

      # 示例脚本是给人抄的，抄错一句就是一轮排障。只做语法级检查：
      # 不联网、不需要上游 Key（Node 18+ 在 ubuntu-latest 自带）。
      - name: Examples syntax
        run: |
          for f in examples/python/*.py; do python -m py_compile "$f"; done
          for f in examples/node/*.mjs; do node --check "$f"; done
          for f in examples/curl/*.sh; do bash -n "$f"; done
